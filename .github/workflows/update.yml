name: Update Apple events

# AUTO-1: daily cron + manual dispatch. The scrape itself is conditional (ETag/
# Last-Modified), so most days return 304 and only recompute time-based status — a
# light, polite request rate that still flips events upcoming → past within a day
# instead of leaving a passed event headlined for a week. GitHub cron is best-effort
# and may be delayed/skipped under load (AUTO-5) — trigger manually when it matters.
on:
  schedule:
    - cron: "0 17 * * *" # daily 17:00 UTC
  workflow_dispatch:

# AUTO-2: never let two runs race on the committed state.
concurrency:
  group: update-apple-events
  cancel-in-progress: false

# AUTO-3: least privilege.
permissions:
  contents: write # commit last-known-good + artifacts
  pages: write # Pages deploy
  id-token: write # Pages deploy (OIDC)
  issues: write # failure notifications

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # AUTO-6: third-party actions pinned to release version tags.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19" # pin the toolchain for reproducibility (NFR-5)
          python-version: "3.14"
          enable-cache: true # restore uv's download cache to speed up `uv sync`

      # The cron only runs the tracker (runtime deps); ci.yml gates lint/type/test.
      # --no-dev skips installing the dev group (pytest/ruff/mypy) on every run.
      - name: Sync dependencies (runtime only)
        run: uv sync --frozen --no-dev

      - name: Run tracker (scrape → diff → regenerate)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # --no-dev so uv run's implicit sync doesn't re-add the dev group we skipped.
        run: uv run --no-dev apple-events-tracker --verbose

      - name: Commit changes (last-known-good in git)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit (FR-8)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update Apple events feed and site"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: update
    # AUTO-4: deploy only when something changed (or on a manual run) — no noisy rebuilds.
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Share the Pages concurrency group with pages.yml so this scheduled deploy and a
    # human-push deploy never hit the github-pages environment at the same time (the
    # Pages API rejects concurrent deployments with a 400). Job-level so it doesn't
    # disturb the workflow-level update-apple-events group guarding the scrape/commit.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
