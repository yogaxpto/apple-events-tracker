name: Update Apple events

# AUTO-1: weekly cron (OD-2) + manual dispatch. GitHub cron is best-effort and may be
# delayed/skipped under load (AUTO-5) — trigger manually for time-sensitive moments.
on:
  schedule:
    - cron: "0 17 * * 1" # Mondays 17:00 UTC
  workflow_dispatch:

# AUTO-2: never let two runs race on the committed state.
concurrency:
  group: update-apple-events
  cancel-in-progress: false

# AUTO-3: least privilege.
permissions:
  contents: write # commit last-known-good + artifacts
  pages: write # Pages deploy
  id-token: write # Pages deploy (OIDC)
  issues: write # new-event / failure notifications

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # AUTO-6: third-party actions pinned to commit SHAs.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv + Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.19" # pin the toolchain for reproducibility (NFR-5)
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Quality gates (lint, type-check, tests)
        run: |
          uv run ruff check .
          uv run mypy .
          uv run pytest

      - name: Run tracker (scrape → diff → regenerate)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run apple-events-tracker --verbose

      - name: Commit changes (last-known-good in git)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit (FR-8)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update Apple events feed and site"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    needs: update
    # AUTO-4: deploy only when something changed (or on a manual run) — no noisy rebuilds.
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
