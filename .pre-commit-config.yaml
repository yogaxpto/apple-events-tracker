# Local quality gates, mirroring CI (.github/workflows/ci.yml). Install with
# `uv run pre-commit install`. Tool versions are pinned to match pyproject.toml /
# uv.lock so local hooks behave identically to CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # data/ and docs/ are generated, committed artifacts — the .ics feed in
        # particular relies on RFC 5545 CRLF endings the fixers would mangle.
        exclude: ^(data|docs)/
      - id: end-of-file-fixer
        exclude: ^(data|docs)/
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy runs through uv so it sees the project environment (strict mode + the
  # icalendar/beautifulsoup4 stubs); an isolated hook env would diverge from CI.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
