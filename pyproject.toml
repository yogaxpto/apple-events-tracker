[project]
name = "apple-events-tracker"
version = "0.1.0"
description = "Auto-updating tracker for Apple special events — publishes an .ics feed and a static site."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Diogo Santos Martins" }]
dependencies = [
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.13,<5",
    "lxml>=6.1.1,<7",
    "icalendar>=7.2.0,<8",
    "jinja2>=3.1,<4",
    "pillow>=12.2.0,<13",
]

[project.scripts]
apple-events-tracker = "apple_events_tracker.cli:main"
apple-events-tracker-preview = "apple_events_tracker.preview:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.15.20,<1",
    "mypy>=2.2.0,<3",
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_events_tracker"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = "src"

# icalendar 7.x ships a py.typed marker but leaves its public API (Event,
# Calendar, .get(), ...) unannotated. Under strict mode that surfaces as
# no-untyped-call noise at every call site, so we skip following its types and
# treat the package as untyped (Any), as it was before 7.x.
[[tool.mypy.overrides]]
module = ["icalendar.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
