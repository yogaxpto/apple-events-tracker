[project]
name = "apple-events-tracker"
version = "0.1.0"
description = "Unofficial, auto-updating tracker for Apple special events — publishes an .ics feed and a static site."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Diogo Santos Martins" }]
dependencies = [
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.13,<5",
    "lxml>=5.3,<6",
    "icalendar>=6.1,<7",
    "jinja2>=3.1,<4",
]

[project.scripts]
apple-events-tracker = "apple_events_tracker.cli:main"
apple-events-tracker-preview = "apple_events_tracker.preview:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_events_tracker"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["icalendar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
