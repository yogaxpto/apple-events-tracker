<head>

  <meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="https://yogaxpto.github.io/apple-events-tracker/favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="https://yogaxpto.github.io/apple-events-tracker/assets/style.css" />

      <div class="hero__actions">
        <a class="btn btn--primary" href="https://yogaxpto.github.io/apple-events-tracker/">Back to the tracker</a>
